<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Paw print in dark color -->
  <g fill="#1a1a1a">
    <!-- Main pad (center) -->
    <ellipse cx="50" cy="65" rx="15" ry="18"/>
    <!-- Top left toe -->
    <ellipse cx="28" cy="35" rx="8" ry="11"/>
    <!-- Top center-left toe -->
    <ellipse cx="45" cy="22" rx="7" ry="10"/>
    <!-- Top center-right toe -->
    <ellipse cx="65" cy="22" rx="7" ry="10"/>
    <!-- Top right toe -->
    <ellipse cx="72" cy="35" rx="8" ry="11"/>
  </g>
</svg>

